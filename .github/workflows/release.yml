name: Build & Release Binaries

# GITHUB_TOKEN 需要写权限来创建 Release 并上传产物，
# 缺失时默认只读 token 会 403: Resource not accessible by integration
permissions:
  contents: write

on:
  push:
    tags:
      - 'v*.*.*'   # 仅在打 tag 时触发
  workflow_dispatch:
    inputs:
      go-version:
        description: 'Go version'
        required: false
        default: '1.21'
      goproxy:
        description: 'GOPROXY (可选)'
        required: false
        default: 'https://proxy.golang.org,direct'
      goprivate:
        description: 'GOPRIVATE (可选)'
        required: false
        default: ''
      upx-version:
        description: 'UPX version (可选)'
        required: false
        default: '5.1.0'
      create-release:
        description: '是否创建 Release (yes/no)'
        required: false
        default: 'no'
        type: choice
        options:
          - 'yes'
          - 'no'
      release-tag:
        description: 'Release 标签 (仅在创建 Release 时需要，如 v1.0.0)'
        required: false
        default: ''

jobs:
  # 发布门禁：测试不过就不许发
  #
  # v1.0.0 是在测试全红的状态下打标发布的 —— statistics/timeseries_test.go
  # 当时就能抓住那个首次采样即 panic 的缺陷，但它从未被执行：
  # test.yml 只在 push 到 master/develop 与 PR 时触发，不在 tag 推送时触发；
  # 而本工作流由 tag 触发，build 只做交叉编译，release 只 needs: build，
  # 于是推一个 tag 就能把崩溃的二进制直接发上去
  test:
    name: 🧪 Test Gate
    runs-on: ubuntu-latest
    steps:
      - name: ⬇️ Checkout Repository
        uses: actions/checkout@v4

      - name: 🛠️ Set up Go
        uses: actions/setup-go@v5
        with:
          go-version: ${{ github.event.inputs.go-version || '1.26' }}
          cache: true

      - name: 📐 Check gofmt
        run: |
          unformatted=$(gofmt -l .)
          if [ -n "$unformatted" ]; then
            echo "以下文件未格式化:"
            echo "$unformatted"
            exit 1
          fi

      - name: 🔍 Go vet
        run: go vet ./...

      - name: 🧪 Test with race detector
        run: go test -race ./... -timeout 15m

  build:
    needs: test
    runs-on: ubuntu-latest
    env:
      UPX_VERSION: ${{ github.event.inputs.upx-version || '5.1.0' }}
      # 默认值须不低于 go.mod 的 go 指令：原先是 1.21，于是 17 个矩阵任务
      # 各自先下载一遍 1.26 工具链才能构建，GOTOOLCHAIN=local 下则直接失败
      GO_VERSION: ${{ github.event.inputs.go-version || '1.26' }}
      GOPROXY: ${{ github.event.inputs.goproxy || 'https://proxy.golang.org,direct' }}
      GOPRIVATE: ${{ github.event.inputs.goprivate || '' }}
    strategy:
      matrix:
        include:
          - goos: windows
            goarch: amd64
          - goos: windows
            goarch: arm64
          - goos: linux
            goarch: amd64
          - goos: linux
            goarch: arm64
          - goos: linux
            goarch: 386
          - goos: linux
            goarch: ppc64le
          - goos: linux
            goarch: s390x
          - goos: linux
            goarch: mips64
          - goos: linux
            goarch: mips64le
          - goos: darwin
            goarch: amd64
          - goos: darwin
            goarch: arm64
          - goos: freebsd
            goarch: amd64
          - goos: freebsd
            goarch: arm64
          - goos: openbsd
            goarch: amd64
          - goos: openbsd
            goarch: arm64
          - goos: netbsd
            goarch: amd64
          - goos: netbsd
            goarch: arm64
          - goos: dragonfly
            goarch: amd64
          - goos: solaris
            goarch: amd64
    steps:

      - name: ⬇️ Checkout Repository
        uses: actions/checkout@v4

      - name: 🛠️ Set up Go
        uses: actions/setup-go@v5
        with:
          go-version: ${{ env.GO_VERSION }}
          cache: true
          cache-dependency-path: go.sum

      - name: 📥 Download Dependencies
        run: |
          export GOPROXY="${{ env.GOPROXY }}"
          export GOPRIVATE="${{ env.GOPRIVATE }}"
          go env
          go mod download


      - name: Build binary
        run: |
          mkdir -p dist
          EXT=""
          if [ "${{ matrix.goos }}" = "windows" ]; then EXT=".exe"; fi
          OUT=dist/go-stress-${{ matrix.goos }}-${{ matrix.goarch }}$EXT
          GOOS=${{ matrix.goos }} GOARCH=${{ matrix.goarch }} go build -v -trimpath -ldflags="-s -w" -o "$OUT" main.go

      - name: ♻️ UPX Cache
        id: upx-cache
        uses: actions/cache@v4
        with:
          path: |
            ~/.cache/upx
            ./upxbin
            ./upx-*
          key: upx-${{ matrix.goos }}-${{ matrix.goarch }}-${{ env.UPX_VERSION }}

      - name: Download and install UPX
        run: |
          set -e
          mkdir -p ~/.cache/upx
          if [[ "${{ matrix.goos }}" == "windows" ]]; then
            if [ ! -f ~/.cache/upx/upx-${{ env.UPX_VERSION }}-win64/upx.exe ]; then
              curl -L -o upx.zip "https://github.com/upx/upx/releases/download/v${{ env.UPX_VERSION }}/upx-${{ env.UPX_VERSION }}-win64.zip"
              unzip -o upx.zip -d ~/.cache/upx/
            fi
            export PATH="$HOME/.cache/upx/upx-${{ env.UPX_VERSION }}-win64:$PATH"
          elif [[ "${{ matrix.goos }}" == "darwin" ]]; then
            echo "UPX 官方已不再提供 macOS 预编译包，跳过 UPX 安装"
          else
            if [ ! -d ~/.cache/upx/upx-${{ env.UPX_VERSION }}-amd64_linux ]; then
              curl -L -o upx.tar.xz "https://github.com/upx/upx/releases/download/v${{ env.UPX_VERSION }}/upx-${{ env.UPX_VERSION }}-amd64_linux.tar.xz"
              tar -xf upx.tar.xz -C ~/.cache/upx/
            fi
            export PATH="$HOME/.cache/upx/upx-${{ env.UPX_VERSION }}-amd64_linux:$PATH"
          fi
          upx --version || echo "UPX 安装失败，但不会阻塞流程"
        shell: bash

      - name: UPX compress binary (optional)
        run: |
          EXT=""
          if [ "${{ matrix.goos }}" = "windows" ]; then EXT=".exe"; fi
          OUT=dist/go-stress-${{ matrix.goos }}-${{ matrix.goarch }}$EXT
          if command -v upx &> /dev/null; then
            echo "🗜️  使用 UPX 压缩 $OUT ..."
            upx --best --lzma "$OUT" || upx --best "$OUT" || echo "UPX 压缩失败，跳过"
          else
            echo "未检测到 UPX,跳过压缩"
          fi
        shell: bash

      - name: Upload artifact
        uses: actions/upload-artifact@v4
        with:
          name: go-stress-${{ matrix.goos }}-${{ matrix.goarch }}
          path: dist/go-stress-${{ matrix.goos }}-${{ matrix.goarch }}*

  release:
    needs: build
    runs-on: ubuntu-latest
    # Tag 推送时自动创建 release，或手动触发时选择创建
    if: startsWith(github.ref, 'refs/tags/') || (github.event_name == 'workflow_dispatch' && github.event.inputs.create-release == 'yes')
    steps:
      - name: Download all artifacts
        uses: actions/download-artifact@v4
        with:
          path: dist

      - name: Create Release
        uses: softprops/action-gh-release@v2
        with:
          tag_name: ${{ github.event.inputs.release-tag || github.ref_name }}
          name: Release ${{ github.event.inputs.release-tag || github.ref_name }}
          draft: false
          prerelease: false
          files: dist/**/go-stress-*