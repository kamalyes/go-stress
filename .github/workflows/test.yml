name: Test

on:
  push:
    branches: [ master, develop ]
    paths:
      - "**.go"
      - "go.mod"
      - "go.sum"
  pull_request:
    branches: [ master, develop ]
    paths:
      - "**.go"
      - "go.mod"
      - "go.sum"

jobs:
  Build:
    strategy:
      matrix:
        # go.mod 要求 go 1.26.0，低于它的版本无法直接构建：
        # 原先写 [1.21.x, 1.22.x] 时每个任务都在偷偷下载 1.26 工具链再编，
        # 矩阵声称测了 1.21/1.22，实际跑的全是 1.26
        go-version: [1.26.x]
        platform: [ubuntu-latest, windows-latest, macos-latest, macos-14]
    runs-on: ${{ matrix.platform }}
    steps:
      - name: Fetch Repository
        uses: actions/checkout@v5

      - name: Install Go
        uses: actions/setup-go@v6
        with:
          go-version: ${{ matrix.go-version }}

      - name: Install gotestsum
        # v1.12.0 固定依赖 golang.org/x/tools v0.19.0，其内部 tokeninternal
        # 镜像了 go/types 内存布局并内置编译期防呆断言，在 Go 1.26 下必炸
        # （invalid array length -delta * delta）；v1.13.0（x/tools v0.36.0）已验证可编
        run: go install gotest.tools/gotestsum@v1.13.0 # 指定版本
      - name: Test
        run: gotestsum -f testname -- ./... -race -count=1 -shuffle=on
        continue-on-error: true

      - name: Test
        run: gotestsum -f testname -- ./... -race -count=1 -coverprofile=coverage.txt -covermode=atomic -shuffle=on
        continue-on-error: true
      - name: Upload coverage reports to Codecov
        if: ${{ matrix.platform == 'ubuntu-latest' && matrix.go-version == '1.26.x' }}
        uses: codecov/codecov-action@v4.5.0
        with:
          token: ${{ secrets.CODECOV_TOKEN }}
          file: ./coverage.txt
          flags: unittests
          slug: kamalyes/go-stress
